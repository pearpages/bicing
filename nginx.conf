server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Cross-origin isolation headers must match apps/web/vite.config.ts (memory API, later
  # SharedArrayBuffer). They are repeated in each location because any add_header inside a
  # location discards the ones inherited from server.

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # Vite fingerprints asset filenames, so they can be cached forever.
  location /assets/ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
